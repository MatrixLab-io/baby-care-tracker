<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Track your baby's vaccines, growth, and milestones based on Bangladesh EPI schedule" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mybabycare.app/" />
    <meta property="og:title" content="MyBabyCare - Baby Care & Vaccine Tracker" />
    <meta property="og:description" content="Track your baby's vaccines, growth, and milestones based on Bangladesh EPI Schedule. Free, offline-ready, and privacy-focused." />
    <meta property="og:image" content="https://mybabycare.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mybabycare.app/" />
    <meta name="twitter:title" content="MyBabyCare - Baby Care & Vaccine Tracker" />
    <meta name="twitter:description" content="Track your baby's vaccines, growth, and milestones based on Bangladesh EPI Schedule. Free, offline-ready, and privacy-focused." />
    <meta name="twitter:image" content="https://mybabycare.app/og-image.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyBabyCare" />
    <meta name="application-name" content="MyBabyCare" />
    <meta name="msapplication-TileColor" content="#0d9488" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@700&display=swap" rel="stylesheet" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>MyBabyCare - Baby Care & Vaccine Tracker</title>

    <script>
      // Saved choice wins; otherwise follow the OS. Runs before paint so the
      // first frame is already the right theme.
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <style>
      /* Loader paints before the stylesheet lands, so the two ground values
         are inlined here. They match --ml-ground in tokens.css. */
      #app-loader {
        position: fixed;
        inset: 0;
        background: #f1f1f1;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      html.dark #app-loader {
        background: #141414;
      }
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(13, 148, 136, 0.25);
        border-top-color: #0d9488;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      html.dark .spinner {
        border-color: rgba(45, 212, 191, 0.25);
        border-top-color: #2dd4bf;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
